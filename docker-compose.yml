# Image Flattener on a NAS (Synology Container Manager → Project, or `docker compose up -d`).
services:
  imageflattener:
    image: ghcr.io/gittster/imageflattener:latest
    # To build on the NAS from this folder instead of pulling the image:
    # build: .
    container_name: imageflattener
    restart: unless-stopped
    ports:
      - "8090:8080" # open http://<nas>:8090
    environment:
      # Where Spoolman runs. Docker containers usually can't resolve .local names;
      # if the app says it can't resolve the host, use the IP instead
      # (e.g. http://192.168.1.20:7912). Can also be changed in the app.
      SPOOLMAN_URL: "http://theplace.local:7912"
      # Optional password prompt (user:password):
      # BASIC_AUTH: "me:change-this"
    volumes:
      # Projects, "My filaments" and settings are stored here.
      - /volume1/docker/imageflattener:/data
